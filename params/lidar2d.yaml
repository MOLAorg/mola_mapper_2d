# =====================================================================================
# Pipeline: point-to-point 2D ICP GRAPH-SLAM
#
# See https://github.com/MOLAorg/mola_mapper_2d
#
# This file holds parameters for mola::Mapper2D,
# for use either programmatically calling initialize(), or from a MOLA system
# launch file. See "mola-cli-launchs/*" examples or the main project docs.
# =====================================================================================

params:
  # These sensor labels will be handled as LIDAR observations:
  # Can be overridden with cli flag --lidar-sensor-label

  # -----------------------------------------------
  # SENSOR INPUTS
  # -----------------------------------------------
  sensor_labels_for_simplemap: ["lidar"]
  lidar_sensor_labels: ["${MOLA_LIDAR_NAME|lidar}"]
  multiple_lidars:
    lidar_count: ${MOLA_LIDAR_COUNT|1} # useful only if using several lidar_sensor_labels or regex's.
    max_time_offset: ${MOLA_LIDAR_MAX_TIME_OFFSET|25e-3} # [s]

  # These sensor labels will be handled as IMU observations:
  imu_sensor_label: "imu"

  # These sensor labels will be handled as GNSS (GPS) (For storage in simplemap only)
  gnss_sensor_label: "gps"

  # Optionally, drop lidar data too close in time:
  min_time_between_scans: 1e-3 # [seconds]

  # -----------------------------------------------
  # PUBLISH
  # -----------------------------------------------

  # When publishing pose updates, the reference frame for both, estimated robot poses, and the local map.
  publish_reference_frame: "${MOLA_LO_PUBLISH_REF_FRAME|map}"

  # When publishing pose updates, the vehicle frame name.
  publish_vehicle_frame: "${MOLA_LO_PUBLISH_VEHICLE_FRAME|base_link}"

  # -----------------------------------------------
  # MAIN GRAPH-SLAM PARAMETERS
  # -----------------------------------------------

  max_dist_to_search_for_icp_edges: 6.0

  # Minimum ICP quality for odometry:
  min_icp_quality_odom: 0.30

  # Minimum ICP quality to accept a LC:
  min_icp_quality_loop_closure: 0.60

  min_icp_quality_replace_old_kf: 0.60 # [0,1]
  min_old_kf_age: 10 # [seconds]

  # How many edges between a potential KF-KF edge to consider it a loop closure:
  min_topological_dist_for_loop_closure: 20

  # Wheels odometry is used to update the last localization until one of the following
  # criteria holds and a new re-localization is run:
  max_rotation_between_localizations: 10.0 # [degrees]
  max_translation_between_localizations: 0.5 # [m]
  max_time_between_localizations: 1.0 # [s]

  # How many edges to try to create/update from the current pose
  # to nearby keyframes:
  max_localization_edges: 7

  # Once a re-localization is run, how far the robot pose must be wrt the closest
  # existing keyframe to create a new KF:
  max_rotation_between_keyframes: 10.0 # [degrees]
  max_translation_between_keyframes: 0.5 # [m]

  max_time_for_odometry_edge: 60 # [s]

  max_lost_with_odometry_for_insertion: 1.5 # [m]

  odometry_edge_sigma: 0.2 # Minimum uncertainty (1 sigma) of odometry edges
  icp_edge_sigma: 0.1 # Uncertainty of ICP edges
  icp_edge_robust_param: 4.0 # Huber robust kernel param (in "sigmas")

  # If enabled, a map will be stored in RAM and (if using the CLI) stored
  # to a ".simplemap" file for later use for localization, etc.
  simplemap:
    generate: ${MOLA_GENERATE_SIMPLEMAP|false} # Can be overridden with CLI flag --output-simplemap
    load_existing_simple_map: ${MOLA_LOAD_SM|""}
    min_translation_between_keyframes: ${MOLA_SIMPLEMAP_MIN_XYZ|0.05} # m
    min_rotation_between_keyframes: ${MOLA_SIMPLEMAP_MIN_ROT|3.0} # deg
    save_final_map_to_file: ${MOLA_SIMPLEMAP_OUTPUT|'final_map.simplemap'}
    save_gnss_max_age: 1.0 # [s] max age of GNSS observations to keep in the keyframe

  # Save the final trajectory in TUM format. Disabled by default.
  estimated_trajectory:
    save_to_file: ${MOLA_SAVE_TRAJECTORY|false}
    output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.txt'}

  # If run within a mola-cli container, and mola_viz is present, use these options
  # to show live progress:
  visualization:
    show_trajectory: true
    show_current_observation: true # shows "live raw" LiDAR points
    current_pose_corner_size: 1.5
    local_map_point_size: 3
    model:
      - file: ${MOLA_VEHICLE_MODEL_FILE|""} # Default: none
        tf.roll: 90.0 # deg

  # Profile the main steps of the odometry pipeline:
  pipeline_profiler_enabled: ${MOLA_PROFILER|true}
  # Profile the internal steps of the ICP implementation:
  icp_profiler_enabled: ${MOLA_PROFILER|true}

  # If set to false, the odometry pipeline will ignore incoming observations
  # until active is set to true (e.g. via the GUI).
  start_active: "${MOLA_START_ACTIVE|true}"

  # ----------------------
  # DEBUG
  # ----------------------
  save_3D_scenes_decimation: 50 # 0: disabled
  save_3D_scenes_prefix: /tmp/debug_graph_slam

# -----------------------------------
# ICP pipeline configuration
# -----------------------------------
icp-lidar-odometry:
  class_name: mp2p_icp::ICP

  # See: mp2p_icp::Parameter
  params:
    maxIterations: 200
    minAbsStep_trans: 1e-4
    minAbsStep_rot: 1e-4
    #generateDebugFiles: true

  solvers:
    - class: mp2p_icp::Solver_GaussNewton
      enabled: true
      params:
      maxIterations: 3
    - class: mp2p_icp::Solver_Horn
      enabled: true
      params: ~

  # Sequence of one or more pairs (class, params) defining mp2p_icp::Matcher
  # instances to pair geometric entities between pointclouds.
  matchers:
    - class: mp2p_icp::Matcher_Point2Line
      params:
        # Inliers distance threshold [meters][mandatory]
        distanceThreshold: 0.40
        # Number of neighbors to look for [mandatory]
        knn: 6
        # Minimum number of found points [mandatory]
        minimumLinePoints: 6
        # maximum e0/e2 and e1/e2 ratio [mandatory]
        lineEigenThreshold: 1e-3
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.20
        runFromIteration: 3 # "from 0 to 0" means "all"
        runUpToIteration: 0
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.75
        runFromIteration: 0 # "from 0 to 0" means "all"
        runUpToIteration: 2
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }

  quality:
    - class: mp2p_icp::QualityEvaluator_PairedRatio
      params:
      threshold: 0.40
      pointLayerMatches:
        - { global: "2d_lidar_decim", local: "2d_lidar_decim" }

  # Filters for point clouds
  #
  # One filter object will be created for each entry, instancing the given class,
  # and with the given parameters. Filters are run in definition order on the
  # input pointcloud_t object.
  #
  filters:
    - class_name: mp2p_icp_filters::FilterDecimateVoxels
      params:
        input_pointcloud_layer: "2d_lidar"
        output_pointcloud_layer: "2d_lidar_decim"
        error_on_missing_input_layer: false # don't crash on missing 2D lidar
        voxel_filter_resolution: 0.05 # [m]
        use_voxel_average: true
        bounding_box_min: [-25, -25, 0.1]
        bounding_box_max: [25, 25, 0.2]

  # Generators
  #
  generators:
    - class_name: mp2p_icp_filters::Generator
      params:
        target_pointcloud_layer: "2d_lidar"
        process_class_names_regex: ".*"
        process_sensor_labels_regex: "HOKUYO.*"

# -----------------------------------
# ICP pipeline configuration
# -----------------------------------
icp-lidar-loop-closure:
  class_name: mp2p_icp::ICP

  # See: mp2p_icp::Parameter
  params:
    maxIterations: 200
    minAbsStep_trans: 1e-4
    minAbsStep_rot: 1e-4
    #generateDebugFiles: true

  solvers:
    - class: mp2p_icp::Solver_GaussNewton
      enabled: true
      params:
        maxIterations: 3
    - class: mp2p_icp::Solver_Horn
      enabled: true
      params: ~

  # Sequence of one or more pairs (class, params) defining mp2p_icp::Matcher
  # instances to pair geometric entities between pointclouds.
  matchers:
    - class: mp2p_icp::Matcher_Point2Line
      params:
        # Inliers distance threshold [meters][mandatory]
        distanceThreshold: 0.50
        # Number of neighbors to look for [mandatory]
        knn: 6
        # Minimum number of found points [mandatory]
        minimumLinePoints: 6
        # maximum e0/e2 and e1/e2 ratio [mandatory]
        lineEigenThreshold: 1e-3
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.20
        runFromIteration: 10 # "from 0 to 0" means "all"
        runUpToIteration: 0
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 2.00
        runFromIteration: 0 # "from 0 to 0" means "all"
        runUpToIteration: 10
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }

  quality:
    - class: mp2p_icp::QualityEvaluator_PairedRatio
      params:
      threshold: 0.30
      pointLayerMatches:
        - { global: "2d_lidar_decim", local: "2d_lidar_decim" }
